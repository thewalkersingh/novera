spring:
  application:
    name: novera-server
  profiles:
    default: dev


  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}            # Render injects PORT
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info