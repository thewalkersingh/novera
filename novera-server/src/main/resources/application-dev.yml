spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/novera_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    show-sql: true

logging:
  level:
    com.novera: DEBUG


springdoc:
  # ==================== API DOCS ====================
  api-docs:
    path: /v3/api-docs
    enabled: true
  # ==================== SWAGGER UI ====================
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method  # method, alpha, or custom
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true
    filter: true
    show-extensions: true
    show-common-extensions: true
    use-root-path: false
  # ==================== PATHS ====================
  paths-to-match: /api/**